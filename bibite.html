<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibite - I FRATELLI FRENNA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="closeAll()"></div>

<!-- MENU BUTTON -->
<button class="menu-btn" onclick="toggleMenu()">☰</button>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

  <h2>MENU</h2>

  <a href="index.html">🏠 Home</a>
  <a href="menu.html">🍕 Pizze</a>
  <a href="bibite.html">🥤 Bibite</a>

</div>

<!-- CARRELLO BUTTON -->
<button class="cart-btn" onclick="toggleCart()">
  🛒 <span id="cart-count">0</span>
</button>

<!-- CARRELLO -->
<div class="cart" id="cart">

  <h2>🛒 Carrello</h2>

  <div id="cart-items"></div>

  <h3 id="total">Totale: €0.00</h3>

</div>

<!-- CONTENUTO -->
<div class="content">

  <section class="menu-section">

    <h1>🥤 BIBITE</h1>

    <div class="cards">

      <div class="card">

        <img src="https://ercoli1928.com/wp-content/uploads/2020/12/1T4A7347-scaled-1.jpg">

        <h3>Coca Cola</h3>

        <span>€2.50</span>

        <button onclick="addToCart('Coca Cola', 2.5)">
          Aggiungi
        </button>

      </div>

      <div class="card">

        <img src="https://hongphatfood.com/wp-content/uploads/2023/05/Fanta-Orange-Soft-Drink.jpg">

        <h3>Fanta</h3>

        <span>€2.50</span>

        <button onclick="addToCart('Fanta', 2.5)">
          Aggiungi
        </button>

      </div>
      <div class="card">

        <img src="https://sfiziedeliziepalermo.com/wp-content/uploads/2020/06/acqua-san-benedetto-naturale-50-cl.jpg">

        <h3>Acqua Naturale</h3>

        <span>€2.50</span>

        <button onclick="addToCart('Acqua Naturale', 2.5)">
          Aggiungi
        </button>

      </div>

       <div class="card">

        <img src="https://www.cicalia.com/it/img/imgproducts/21063/l_21063.jpg">

        <h3>Acqua Frizzante</h3>

        <span>€2.50</span>

        <button onclick="addToCart('Acqua Frizzante', 2.5)">
          Aggiungi
        </button>

      </div>

      <div class="card">

        <img src="https://www.birraperoni.it/wp-content/uploads/2021/06/Peroni-pk-33-perlage.png">

        <h3>Birra Peroni</h3>

        <span>€3.50</span>

        <button onclick="addToCart('Birra Peroni', 3.5)">
          Aggiungi
        </button>

      </div>

    </div>

  </section>

</div>

<!-- SCRIPT -->
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

/* MENU */
function toggleMenu(){

  document.getElementById("sidebar").classList.toggle("open");

  document.getElementById("overlay").classList.toggle("show");

}

/* CARRELLO */
function toggleCart(){

  document.getElementById("cart").classList.toggle("open");

  document.getElementById("overlay").classList.toggle("show");

}

/* CHIUDI TUTTO */
function closeAll(){

  document.getElementById("sidebar").classList.remove("open");

  document.getElementById("cart").classList.remove("open");

  document.getElementById("overlay").classList.remove("show");

}

/* AGGIUNGI */
function addToCart(name, price){

  cart.push({name, price});

  saveCart();

  renderCart();

}

/* RIMUOVI */
function removeItem(index){

  cart.splice(index, 1);

  saveCart();

  renderCart();

}

/* SALVA */
function saveCart(){

  localStorage.setItem("cart", JSON.stringify(cart));

}

/* RENDER */
function renderCart(){

  const container = document.getElementById("cart-items");

  const totalEl = document.getElementById("total");

  const countEl = document.getElementById("cart-count");

  container.innerHTML = "";

  let total = 0;

  cart.forEach((item, index) => {

    total += item.price;

    container.innerHTML += `
      <div class="cart-item">

        <p>${item.name} - €${item.price}</p>

        <button onclick="removeItem(${index})">
          X
        </button>

      </div>
    `;
  });

  totalEl.innerText = "Totale: €" + total.toFixed(2);

  countEl.innerText = cart.length;

}

/* ESC */
document.addEventListener("keydown", function(event){

  if(event.key === "Escape"){

    closeAll();

  }

});

renderCart();

</script>
<script>

function toggleMenu(){

  const sidebar = document.getElementById("sidebar");

  sidebar.classList.toggle("open");

}

</script>
</body>
</html>
