<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeAll()"></div>





<!-- NAVBAR -->
<nav>

  <div class="logo-area">
    <img src="logo.png" alt="Logo Pizzeria" class="logo">
    <h1>PIZZERIA DEL POPOLO</h1>
  </div>

  <ul>
    <li><a href="menu.html">Menu</a></li>
    <li><a href="prenota.html">Prenota Ora</a></li>
  </ul>

</nav>

<!-- HERO -->
<header>

  <div class="hero">

    <h2>La Vera Pizza Napoletana</h2>

    <p>Ingredienti freschi e tradizione italiana</p>

    <a href="prenota.html" class="btn">
      Prenota Ora
    </a>

  </div>

</header>

<!-- INTRO -->
<section class="intro">

  <h2>Benvenuti da PIZZERIA DEL POPOLO</h2>

  <p>
    La pizzeria dove il gusto incontra la tradizione.
  </p>

</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 PIZZERIA DEL POPOLO</p>
   <small class="credits">
    MADE BY WEBSITECREATION2
  </small>
</footer>

<!-- SCRIPT -->
<script>

/* MENU */
function toggleMenu(){

  document.getElementById("sidebar").classList.toggle("open");

  document.getElementById("overlay").classList.toggle("show");

}

/* CHIUDI TUTTO */
function closeAll(){

  document.getElementById("sidebar").classList.remove("open");

  document.getElementById("overlay").classList.remove("show");

}

/* CHIUSURA CON ESC */
document.addEventListener("keydown", function(event){

  if(event.key === "Escape"){

    closeAll();

  }

});

</script>

</body>
