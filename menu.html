<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizze - Pizzeria del popolo</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="closeAll()"></div>

<!-- MENU BUTTON -->
<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div class="sidebar" id="sidebar">

  <h2>MENU</h2>

  <a href="index.html">🏠 Home</a>
  <a href="menu.html">🍕 Pizze</a>
  <a href="bibite.html">🥤 Bibite</a>

</div>



<!-- CONTENUTO -->
<div class="content">

  <section class="menu-section">

    <h1>🍕 PIZZE</h1>

    <div class="cards">

      <div class="card">
        <img src="https://assets-eu-01.kc-usercontent.com/6190ffc3-df26-019e-e092-120e0715df95/9c076f13-af22-410c-876d-7986dd243846/Pizza%20margherita.png?w=626&fm=webp&lossless=0&q=80">

        <h3>Margherita</h3>

        <span>€7</span>

        <button onclick="addToCart('Margherita', 7)">
          Aggiungi
        </button>
      </div>

      <div class="card">
        <img src="https://www.salumikings.it/wp-content/uploads/2024/10/Piizza-diavola-Kings.jpg">

        <h3>Diavola</h3>

        <span>€9</span>

        <button onclick="addToCart('Diavola', 9)">
          Aggiungi
        </button>
      </div>

    </div>

  </section>

</div>

<!-- SCRIPT -->
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.add("show");
}

function toggleCart(){
  document.getElementById("cart").classList.toggle("open");
  document.getElementById("overlay").classList.add("show");
}

function closeAll(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("cart").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

/* AGGIUNGI AL CARRELLO */
function addToCart(name, price){

  cart.push({name, price});

  saveCart();

  renderCart();

}

/* RIMUOVI */
function removeItem(index){

  cart.splice(index, 1);

  saveCart();

  renderCart();

}

/* SALVA */
function saveCart(){

  localStorage.setItem("cart", JSON.stringify(cart));

}

/* RENDER */
function renderCart(){

  const container = document.getElementById("cart-items");

  const totalEl = document.getElementById("total");

  const countEl = document.getElementById("cart-count");

  container.innerHTML = "";

  let total = 0;

  cart.forEach((item, index) => {

    total += item.price;

    container.innerHTML += `
      <div class="cart-item">

        <p>${item.name} - €${item.price}</p>

        <button onclick="removeItem(${index})">
          X
        </button>

      </div>
    `;
  });

  totalEl.innerText = "Totale: €" + total.toFixed(2);

  countEl.innerText = cart.length;

}

/* ESC */
document.addEventListener("keydown", function(event){

  if(event.key === "Escape"){

    closeAll();

  }

});

renderCart();

</script>
<script>

function toggleMenu(){

  const sidebar = document.getElementById("sidebar");

  sidebar.classList.toggle("open");

}

</script>
</body>
</html>
